name: "SkillFuse – scan agent skills"
description: "Scan AI agent skills (SKILL.md, agents, prompts, MCP configs) for prompt injection, hidden content, exfiltration, tool overreach and capability drift. Produces SARIF and gates CI."
author: "SkillFuse contributors"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan"
    required: false
    default: "."
  version:
    description: "SkillFuse version to install (PyPI spec), or 'local' to install from the checked-out repository"
    required: false
    default: "local"
  policy:
    description: "Path to a policy YAML (defaults to the built-in policy)"
    required: false
    default: ""
  config:
    description: "Path to .skillfuse.yaml"
    required: false
    default: ""
  fail-on:
    description: "Deterministic finding severity that fails the job: critical | high | medium | low | info"
    required: false
    default: "high"
  fail-on-heuristic:
    description: "Let heuristic findings fail the job too"
    required: false
    default: "false"
  fail-on-quarantine:
    description: "Fail when policy quarantines a skill"
    required: false
    default: "false"
  lock:
    description: "Path to skillfuse.lock to verify against (auto-detected if present)"
    required: false
    default: ""
  require-lock:
    description: "Fail when a skill is not in the lockfile"
    required: false
    default: "false"
  detonate:
    description: "Also run scripts in the sandbox"
    required: false
    default: "false"
  sarif:
    description: "Where to write SARIF"
    required: false
    default: "skillfuse.sarif"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning (requires security-events: write)"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "0 ok · 1 findings over threshold · 2 policy block · 3 quarantine · 4 lock drift · 10 error"
    value: ${{ steps.run.outputs.exit-code }}
  findings:
    description: "Total number of findings"
    value: ${{ steps.run.outputs.findings }}
  blocked:
    description: "Number of blocked skills"
    value: ${{ steps.run.outputs.blocked }}
  sarif:
    description: "Path to the SARIF file"
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install SkillFuse
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$INPUT_VERSION" = "local" ]; then
          uv tool install --from "$ACTION_PATH" skillfuse
        else
          uv tool install "skillfuse==$INPUT_VERSION"
        fi
        skillfuse --version
    - name: Run SkillFuse CI gate
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_LOCK: ${{ inputs.lock }}
        INPUT_FAIL_ON_HEURISTIC: ${{ inputs.fail-on-heuristic }}
        INPUT_FAIL_ON_QUARANTINE: ${{ inputs.fail-on-quarantine }}
        INPUT_REQUIRE_LOCK: ${{ inputs.require-lock }}
        INPUT_DETONATE: ${{ inputs.detonate }}
      run: |
        set +e
        args=("$INPUT_PATH" --sarif "$INPUT_SARIF" --fail-on "$INPUT_FAIL_ON")
        [ -n "$INPUT_POLICY" ] && args+=(--policy "$INPUT_POLICY")
        [ -n "$INPUT_CONFIG" ] && args+=(--config "$INPUT_CONFIG")
        [ -n "$INPUT_LOCK" ] && args+=(--lock "$INPUT_LOCK")
        [ "$INPUT_FAIL_ON_HEURISTIC" = "true" ] && args+=(--fail-on-heuristic)
        [ "$INPUT_FAIL_ON_QUARANTINE" = "true" ] && args+=(--fail-on-quarantine)
        [ "$INPUT_REQUIRE_LOCK" = "true" ] && args+=(--require-lock)
        [ "$INPUT_DETONATE" = "true" ] && args+=(--detonate)
        skillfuse ci "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif) != ''
      uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        sarif_file: ${{ inputs.sarif }}
        category: skillfuse
